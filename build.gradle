// Gradle build file for ordt

plugins {
    id 'java'
    id 'antlr'
    id 'com.gradleup.shadow' version '9.4.1'
}

description = 'Tool to generate register RTL, models, and docs using ' +
              'SystemRDL or JSpec input'

// Extract version from constant in Ordt.java
def versionMatcher = file('src/ordt/extract/Ordt.java').text =~ /String version = "(.*)";/
version = versionMatcher[0][1]

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.abego.treelayout:org.abego.treelayout.core:1.0.3'
    antlr        'org.antlr:antlr4:4.13.2'
    implementation 'org.antlr:antlr4-runtime:4.13.2'
}

final antlrSrc = 'src/ordt/parse/grammars'
final antlrGen = 'build/generated-src/antlr/main'

sourceSets {
    main {
        java {
            srcDirs = [
                'src/ordt/annotate',
                'src/ordt/extract',
                'src/ordt/output',
                'src/ordt/parameters',
                antlrGen
            ]
        }
        antlr {
            srcDirs = [antlrSrc]
        }
    }
}

// Copy MyDebugController.example to MyDebugController.java if it does not
// already exist.  Local edits are preserved.
// Use the distclean target to remove the generated copy.
tasks.register('copyMyDebugController') {
    doLast {
        def dest = file('src/ordt/extract/MyDebugController.java')
        if (!dest.exists())
            dest.bytes = file('src/ordt/extract/MyDebugController.example').bytes
    }
}

tasks.named('compileJava') {
    dependsOn('copyMyDebugController', 'generateGrammarSource')
}

// Force recompilation of all grammar files every time so that import
// dependencies between grammars are always resolved correctly.
tasks.named('generateGrammarSource') {
    outputs.upToDateWhen { false }
}

tasks.named('shadowJar') {
    archiveBaseName = 'Ordt'
    archiveClassifier = ''
    archiveVersion = project.version.toString()

    manifest {
        attributes 'Main-Class': 'ordt.extract.Ordt'
    }

    // The antlr plugin adds the full tool jar to the classpath, not just the
    // runtime.  Exclude it here so only antlr4-runtime ends up in the fat jar.
    dependencies {
        exclude(dependency('org.antlr:antlr4:.*'))
    }
}

tasks.register('distclean') {
    dependsOn('clean')
    doLast {
        file('src/ordt/extract/MyDebugController.java').delete()
    }
}

// Eclipse IDE task: generates ANTLR source and moves output files into the
// correct package directories under src/ so Eclipse can find them.
tasks.register('generateEclipseGrammarSource') {
    dependsOn('generateGrammarSource')
    doLast {
        final destFolder = 'src'
        moveAntlrGeneratedFilesToTheirPackages(antlrSrc, 'ExtParms',  antlrGen, destFolder)
        moveAntlrGeneratedFilesToTheirPackages(antlrSrc, 'JSpec',     antlrGen, destFolder)
        moveAntlrGeneratedFilesToTheirPackages(antlrSrc, 'SystemRDL', antlrGen, destFolder)
        moveAntlrGeneratedFilesToTheirPackages(antlrSrc, 'SimpleSV',  antlrGen, destFolder)
    }
}

def moveAntlrGeneratedFilesToTheirPackages(grammarFolder, grammarName, genFolder, destFolder) {
    File grammarFile = file("${grammarFolder}/${grammarName}.g4")
    final grammarPackage = extractPackageNameFromGrammarFile(grammarFile)
    copy {
        from genFolder
        include "${grammarName}*.*"
        into "${destFolder}/${grammarPackage.replaceAll('\\.', '/')}"
    }
    delete fileTree(genFolder).include("${grammarName}*.*")
}

def extractPackageNameFromGrammarFile(File grammarFile) {
    def grammarPackage = 'unknown.package'
    def packageRegex = ~/[ ]*package[ ]*([a-zA-Z][a-zA-Z0-9._-]*)[ ]*;/
    grammarFile.eachLine { line ->
        def matcher = packageRegex.matcher(line)
        if (matcher.find()) {
            grammarPackage = matcher.group(1)
        }
    }
    return grammarPackage
}
